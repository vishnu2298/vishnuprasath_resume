name: Connectly CI
on:
  push:
    paths: ['connectly/**', '.github/workflows/connectly-ci.yml']
  pull_request:
    paths: ['connectly/**']
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: connectly/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: connectly/backend/package-lock.json }
      - run: npm ci
      - run: npm test
  insights:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: connectly/services/insights } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: connectly/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: connectly/mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
